name: Refresh menus and deploy
on:
  schedule:
    - cron: "30 12 * * *"   # ~5:30am PDT / 4:30am PST
    - cron: "30 17 * * *"   # ~10:30am PDT
    - cron: "30 22 * * *"   # ~3:30pm PDT
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt
      - name: Scrape (skipped on plain pushes)
        if: github.event_name != 'push'
        run: python scraper/fetch_menus.py
      - name: Commit menus.json
        if: github.event_name != 'push'
        run: |
          git config user.name "menu-bot"; git config user.email "menu-bot@users.noreply.github.com"
          git add site/menus.json; git diff --cached --quiet || (git commit -m "Update menus" && git push)
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
